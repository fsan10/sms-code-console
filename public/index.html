<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 短信验证码管理平台</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f6bff'/%3E%3Ctext x='32' y='43' font-size='34' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E%E7%9F%AD%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">短</div>
      <div>
        <h1>短信验证码管理平台</h1>
        <p>内部使用 · 全部操作留痕可查</p>
      </div>
    </div>

    <form class="login-form" id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">账号</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username"
               placeholder="请输入账号" required autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password"
               placeholder="请输入密码" required>
      </div>
      <div class="alert" id="loginError"></div>
      <button class="btn btn-primary btn-lg btn-block" id="loginBtn" type="submit">登 录</button>
    </form>

    <div class="login-foot">
      登录行为、验证码复制记录与用途备注均会被完整审计
    </div>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('loginForm');
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');

  // 分享链接带的 sharecode 需要跟着每一个请求走，否则网关会拦截
  var params = new URLSearchParams(location.search);
  var share = params.get('sharecode') || sessionStorage.getItem('sms_share') || '';
  if (share) sessionStorage.setItem('sms_share', share);
  function withShare(url) {
    if (!share) return url;
    return url + (url.indexOf('?') === -1 ? '?' : '&') + 'sharecode=' + encodeURIComponent(share);
  }

  function showError(msg) {
    err.textContent = msg;
    err.classList.add('show');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = '登录中…';

    fetch(withShare('/api/login'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || '登录失败');
        location.replace(withShare('/app'));
      });
    }).catch(function (e2) {
      showError(e2.message || '网络异常，请稍后再试');
      btn.disabled = false;
      btn.textContent = '登 录';
    });
  });
})();
</script>
</body>
</html>
